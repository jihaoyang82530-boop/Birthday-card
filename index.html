<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日蛋糕3</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: black;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #start-btn {
            background-color: #ffb6c1;
            color: #fff;
            font-size: 1.5rem;
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.8), 0 0 30px rgba(255, 182, 193, 0.5);
            transition: all 0.3s ease;
        }

        #start-btn:hover {
            box-shadow: 0 0 20px rgba(255, 182, 193, 1), 0 0 40px rgba(255, 182, 193, 0.8);
            transform: scale(1.05);
        }

        .video-background {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%) scale(0.7); 
            object-fit: contain; 
            z-index: 1; 
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgb(240, 17, 155);
            font-size: 0.5rem;
            font-family: 华文彩云;
            animation: pulse 1.5s infinite;
            text-align: center;
            z-index: 2; 
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">开启礼物</button>
    </div>

    <!-- 增加了 preload="auto" 让手机提前缓冲视频 -->
    <video id="cake-video" class="video-background" autoplay muted loop playsinline webkit-playsinline preload="auto">
        <source src="生日蛋糕3.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <audio id="music1" loop preload="auto" controls hidden>
         <source src="canon.mp3" type="audio/mpeg">
         Your browser does not support the audio element.
    </audio>
     
    <script>
         document.getElementById('start-btn').addEventListener('click', function() {
            // 1. 隐藏遮罩层
            document.getElementById('start-screen').style.display = 'none';
            
            // 2. 播放音乐
            var myAudio = document.getElementById('music1');
            myAudio.play().catch(function(error) { console.log("音乐播放失败", error); });
            
            // 3. 强力播放视频（处理手机端各种拒绝播放的异常）
            var myVideo = document.getElementById('cake-video');
            
            // 手机端 sometimes 需要重置一下播放进度
            myVideo.currentTime = 0; 
            
            var playPromise = myVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // 播放成功
                    console.log("视频开始播放");
                }).catch(error => {
                    // 如果播放被拒绝，尝试重新加载并再次播放
                    console.log("尝试重新播放视频", error);
                    myVideo.load();
                    myVideo.play();
                });
            }
         });
    </script>
    
    <div class="content">
    </div>

</body>
</html>
