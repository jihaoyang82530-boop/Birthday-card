<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日蛋糕3</title>
    <style>
        /* 设置body和html全屏，背景为黑色 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: black; /* 背景保持黑色 */
        }

        /* 开启礼物初始遮罩层 */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black; /* 纯黑色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999; /* 保证遮罩层在最上面 */
        }

        /* 浅粉色发光按钮 */
        #start-btn {
            background-color: #ffb6c1; /* 浅粉色 */
            color: #fff;
            font-size: 1.5rem;
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            /* 轻微发光效果 */
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.8), 0 0 30px rgba(255, 182, 193, 0.5);
            transition: all 0.3s ease;
        }

        /* 鼠标悬停时发光增强 */
        #start-btn:hover {
            box-shadow: 0 0 20px rgba(255, 182, 193, 1), 0 0 40px rgba(255, 182, 193, 0.8);
            transform: scale(1.05);
        }

        /* 背景视频：完整显示视频，放大到70%并居中 */
        .video-background {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%) scale(0.7); 
            object-fit: contain; 
            z-index: 1; 
        }

        /* 页面内容 */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgb(240, 17, 155);
            font-size: 0.5rem;
            font-family: 华文彩云;
            animation: pulse 1.5s infinite;
            text-align: center;
            z-index: 2; 
        }
    </style>
</head>
<body>

    <!-- 初始按钮界面 -->
    <div id="start-screen">
        <button id="start-btn">开启礼物</button>
    </div>

    <!-- 背景视频（保持不变） -->
    <video class="video-background" autoplay muted loop>
        <source src="生日蛋糕3.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <!-- 音频：已换成本地《卡农》文件 -->
    <audio id="music1" loop preload="auto" controls hidden>
         <!-- 确保名为 canon.mp3 的音乐文件和本 HTML 文件在同一个文件夹里 -->
         <source src="canon.mp3" type="audio/mpeg">
         Your browser does not support the audio element.
    </audio>
     
    <script>
         // 将点击事件绑定到【开启礼物】按钮上
         document.getElementById('start-btn').addEventListener('click', function() {
            // 1. 隐藏初始的黑色遮罩层和按钮
            document.getElementById('start-screen').style.display = 'none';
            
            // 2. 开始播放音乐
            var myAudio = document.getElementById('music1');
            myAudio.play();
         });
    </script>
    
    <!-- 页面内容 -->
    <div class="content">
    </div>

</body>
</html>
